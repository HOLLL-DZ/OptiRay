name: Ошибка
description: Сообщить о проблеме в OptiRay
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: Не прикладывайте ссылки подписок, HWID, пароли, ключи или полный бэкап.
  - type: input
    id: version
    attributes:
      label: Версия OptiRay
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Модель Keenetic, архитектура и версия прошивки
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Шаги воспроизведения
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ожидаемое и фактическое поведение
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Обезличенный фрагмент лога или скриншот
