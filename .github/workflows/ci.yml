name: Go checks and router builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.23.12'
          cache: false
      - name: Tests and vet
        working-directory: go-optiray
        run: |
          go test ./...
          go vet ./...
      - name: Build packages for ARM64 and MIPSel
        shell: pwsh
        run: ./go-optiray/package.ps1
